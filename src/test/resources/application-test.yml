spring:
  datasource:
    url: jdbc:h2:mem:wifi-admin-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always

wifi-platform:
  url: http://127.0.0.1:8080/platform
  connect-timeout: 500ms
  read-timeout: 1s

wifi-sync:
  cron: "0 0 2 * * *"
  cpe-count: 12

wifi-admin:
  security:
    enabled: false
    header-name: X-API-Key
    api-key:

logging:
  pattern:
    level: "%5p [requestId=%X{requestId}]"
  level:
    local.wifiadmin: WARN
    org.apache.cxf: ERROR
