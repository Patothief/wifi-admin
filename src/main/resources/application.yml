server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:file:./data/wifi-admin;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always

wifi-platform:
  url: http://127.0.0.1:8080/platform
  connect-timeout: 2s
  read-timeout: 5s

logging:
  level:
    local.wifiadmin: INFO
    org.apache.cxf: WARN
